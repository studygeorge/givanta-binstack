<text x="528.0" y="156.0" font-family="Segoe UI, Arial" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold">Сплошной пластик</text>
<text x="528.0" y="184.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— 3 верхних слоя  0,75 мм</text>
<text x="528.0" y="208.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— 3 нижних слоя  0,75 мм</text>
<text x="528.0" y="232.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— 2 периметра по бокам  0,84 + 0,84 мм</text>
<text x="528.0" y="256.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— итого 11,9 мм2 из 20 мм2 сечения = 59 %</text>
<text x="528.0" y="300.0" font-family="Segoe UI, Arial" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold">Полость с заполнением</text>
<text x="528.0" y="328.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— 2,32 мм в ширину и 3,50 мм в высоту</text>
<text x="528.0" y="352.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— 8,1 мм2 = 41 % сечения</text>
<text x="528.0" y="376.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— при Gyroid 10 % туда идёт 0,8 мм2</text>
<text x="528.0" y="400.0" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">— пластика всего 12,7 мм2 = 63 % сечения</text>
<text x="528.0" y="450.0" font-family="Segoe UI, Arial" font-size="14" fill="#c8500a" text-anchor="start">Если нужно ещё легче: слои 2/2 вместо 3/3 дают 58 %.</text>
<text x="528.0" y="474.0" font-family="Segoe UI, Arial" font-size="14" fill="#c8500a" text-anchor="start">3 периметра ставить нельзя: полость схлопнется до 1,5 мм, пластика 77 %.</text><rect x="702" y="498" width="470" height="54" fill="white" stroke="#1a1a1a" stroke-width="1.5"/><text x="714" y="520" font-size="17" font-weight="bold" fill="#c8500a" font-family="Segoe UI, Arial">GIVANTA MASTERS</text><text x="714" y="540" font-size="13" fill="#1a1a1a" font-family="Segoe UI, Arial">BINSTACK P — сечение раскоса, сопло 0,4 · слой 0,25</text></svg>
