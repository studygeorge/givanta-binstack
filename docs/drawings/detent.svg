<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Arial"><rect width="1240" height="880" fill="white"/><rect x="8" y="8" width="1224" height="864" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="60.0" y="46.0" font-family="Segoe UI, Arial" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="bold">Полозья и детент: на чём лоток ездит и чем держится</text>
<text x="60.0" y="85.0" font-family="Segoe UI, Arial" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">Сечение поперёк: узел «фланец в пазу»</text>
