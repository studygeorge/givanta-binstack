<text x="167.0" y="172.5" font-family="Segoe UI, Arial" font-size="13" fill="#c8500a" text-anchor="middle">полозья</text>
<text x="300.0" y="239.8" font-family="Segoe UI, Arial" font-size="14" fill="#1a1a1a" text-anchor="start">фланец дна лотка входит в паз</text>
<text x="300.0" y="260.8" font-family="Segoe UI, Arial" font-size="13" fill="#c8500a" text-anchor="start">перекрытие 5,5 мм — на нём лоток и висит</text>
<text x="300.0" y="155.0" font-family="Segoe UI, Arial" font-size="13" fill="#1a1a1a" text-anchor="start">стенка лотка</text>
